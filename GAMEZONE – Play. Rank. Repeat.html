<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GAMEZONE – Play. Rank. Repeat.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="GAMEZONE: play games, build your profile and climb the leaderboards.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#120808;--line:#4a1010;--txt:#ffffff;--mut:#c9b8b8;--p:#ff1e1e;--b:#ff5555;--grad:linear-gradient(135deg,#ff2a2a,#c70000)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#6a0a0a66,transparent),var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:#050505e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.logo{font-weight:900;font-size:1.4rem;letter-spacing:.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{padding:6px 12px;border-radius:8px;color:var(--mut)}
nav a.on,nav a:hover{color:var(--txt);background:#ffffff12}
#q{flex:1 1 180px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
main{max-width:1080px;margin:auto;padding:24px 16px 60px}
h1,h2{line-height:1.1;margin:0 0 12px}
h2{font-size:1.5rem}
.hero{padding:48px 0 32px}
.hero h1{font-size:clamp(2.6rem,10vw,5.5rem);font-weight:900;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px #ff1e1e66)}
.hero p{max-width:46ch;color:var(--mut);font-size:1.15rem}
.btn{display:inline-block;border:0;cursor:pointer;padding:10px 20px;border-radius:10px;background:var(--grad);color:#fff;font-weight:700}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.game{display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.game:hover{border-color:var(--p)}
.ico{font-size:2.2rem}
.game .btn{align-self:flex-start;margin-top:6px;padding:6px 14px}
.tag{font-size:.8rem;color:var(--b)}
.mut{color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 14px;cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p)}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
tr.me{background:#ff1e1e22}
.sec{margin-top:36px}
form{display:grid;gap:12px;max-width:380px}
input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.err{color:#ff7a90;min-height:1.2em}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:2.4rem;font-weight:800;color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:16px}
.stats b{display:block;font-size:1.6rem}
#arena{position:relative;height:320px;border-radius:14px;border:1px solid var(--line);background:#0a0404;overflow:hidden;touch-action:manipulation}
#tgt{position:absolute;width:64px;height:64px;border-radius:50%;border:0;background:var(--grad);box-shadow:0 0 24px var(--p);cursor:pointer}
@media(prefers-reduced-motion:no-preference){#tgt{transition:transform .08s}#tgt:active{transform:scale(.9)}}

/* Red and black esports theme */
body{font-family:'Rajdhani',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;font-weight:500;background:radial-gradient(900px 520px at 85% -10%,#6a0a0a66,transparent),radial-gradient(700px 400px at 0% 100%,#3a050555,transparent),#050505}
h1,h2,.logo,.btn,.chip,nav a,th,.stats b{font-family:'Orbitron','Rajdhani',system-ui,sans-serif}
h2{font-size:1.3rem;letter-spacing:.05em;text-transform:uppercase}
.logo{letter-spacing:.12em;filter:drop-shadow(0 0 10px #ff1e1e99)}
header{border-bottom:1px solid #8a0f0f;box-shadow:0 2px 24px #ff1e1e33}
nav a{text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;font-weight:700;transition:color .2s,background .2s,box-shadow .2s}
nav a:hover{color:#fff;background:#ff1e1e22;box-shadow:0 0 14px #ff1e1e88}
nav a.on{color:#fff;background:linear-gradient(135deg,#ff2a2a,#a00000);box-shadow:0 0 16px #ff1e1e99}
.hero h1{background-image:linear-gradient(180deg,#fff 5%,#ff2a2a 65%,#a00000);filter:drop-shadow(0 0 30px #ff1e1e99)}
.btn{letter-spacing:.06em;text-transform:uppercase;font-size:.82rem;box-shadow:0 0 16px #ff1e1e66;transition:transform .2s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 28px #ff1e1ecc,0 0 6px #ff6b6b;filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid #ff1e1e;box-shadow:none}
.btn.ghost:hover{background:#ff1e1e22;box-shadow:0 0 22px #ff1e1e99}
.card{background:linear-gradient(160deg,#160a0a,#0a0404);border-color:#5a1010;box-shadow:0 0 14px #ff1e1e1f,inset 0 0 18px #00000099;transition:border-color .2s,box-shadow .25s,transform .25s}
a.game:hover{border-color:#ff2a2a;box-shadow:0 0 26px #ff1e1e88,inset 0 0 18px #00000099;transform:translateY(-4px)}
.chip{transition:border-color .2s,box-shadow .2s,background .2s}
.chip:hover{border-color:#ff2a2a;box-shadow:0 0 12px #ff1e1e88}
.chip.on{background:linear-gradient(135deg,#ff2a2a,#b30000);border-color:#ff2a2a;color:#fff}
input{transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#ff2a2a;box-shadow:0 0 14px #ff1e1e88;outline:none}
th{text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:#ff5555}
tr:hover td{background:#ff1e1e14}
iframe,#arena{box-shadow:0 0 22px #ff1e1e44;border-color:#8a0f0f!important}
.avatar{box-shadow:0 0 24px #ff1e1e99}
#tgt{box-shadow:0 0 30px #ff1e1e,0 0 8px #fff}
main>*{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
<a class="logo" href="#home">GAMEZONE</a>
<input id="q" type="search" placeholder="Search games" aria-label="Search games">

</div></header>
<main id="app"></main>
<script>

const GAMES=[

const FEAT=['snake','ttt','rps','memory','space','drift','chess','num','basket','pen'];
const DOCS={"drift": "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Neon Traffic<\/title>\n<style>html,body{margin:0;height:100%;background:#050505;overflow:hidden;touch-action:none}canvas{display:block;margin:auto;height:100%;max-width:100%}<\/style><\/head>\n<body><canvas id=\"c\" width=\"360\" height=\"560\"><\/canvas>\n<script>\nconst c=document.getElementById('c'),x=c.getContext('2d'),W=360,H=560,RX=40,RW=280,LW=RW/3;\nlet car,en,sp,sc,state='ready',keys={},ptr=0,off=0,spawn=0,lock=0;\nfunction reset(){car={x:W/2,w:34,h:60,y:H-110};en=[];sp=4;sc=0;spawn=30;state='play'}\nfunction go(){if(state!=='play'&&Date.now()>lock)reset()}\naddEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '||e.key==='Enter')go()});\naddEventListener('keyup',e=>keys[e.key]=0);\nc.addEventListener('pointerdown',e=>{go();const r=c.getBoundingClientRect();ptr=e.clientX<r.left+r.width/2?-1:1});\naddEventListener('pointerup',()=>ptr=0);\nfunction body(px,py,w,h,col,me){x.save();x.shadowColor=col;x.shadowBlur=14;x.fillStyle=col;x.beginPath();x.roundRect(px-w/2,py,w,h,8);x.fill();x.shadowBlur=0;x.fillStyle='#050505';x.fillRect(px-w/2+5,py+(me?16:h-30),w-10,14);x.fillStyle='#fff';if(me){x.fillRect(px-w/2+4,py+2,7,4);x.fillRect(px+w/2-11,py+2,7,4)}else{x.fillRect(px-w/2+4,py+h-6,7,4);x.fillRect(px+w/2-11,py+h-6,7,4)}x.restore()}\nfunction step(){off=(off+sp)%60;if(state!=='play')return;\nconst d=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0)+ptr;\ncar.x=Math.min(RX+RW-car.w/2-4,Math.max(RX+car.w/2+4,car.x+d*5.5));\nif(--spawn<=0){const l=Math.floor(Math.random()*3);en.push({x:RX+LW*l+LW/2+(Math.random()*16-8),y:-70,w:34,h:60,s:Math.random()*1.2,col:['#e5e5e5','#f59e0b','#9ca3af','#fbbf24'][Math.floor(Math.random()*4)]});spawn=Math.max(24,70-sc/10|0)}\nsp+=0.0025;sc+=sp/40;\nfor(const e of en){e.y+=sp*.8+e.s;if(Math.abs(e.x-car.x)<(e.w+car.w)/2-4&&Math.abs(e.y-car.y)<(e.h+car.h)/2-6){state='over';lock=Date.now()+500;parent.postMessage({gz:'score',game:'drift',score:Math.floor(sc)},'*')}}\nen=en.filter(e=>e.y<H+80)}\nfunction txt(t,y,s,col){x.fillStyle=col||'#ffffff';x.font='700 '+s+'px system-ui,sans-serif';x.textAlign='center';x.fillText(t,W/2,y)}\nfunction draw(){x.fillStyle='#050505';x.fillRect(0,0,W,H);x.fillStyle='#120808';x.fillRect(RX,0,RW,H);\nx.fillStyle='#ff1e1e';x.fillRect(RX-3,0,3,H);x.fillStyle='#ff5555';x.fillRect(RX+RW,0,3,H);\nx.fillStyle='#4a1010';for(let l=1;l<3;l++)for(let y=-60+off;y<H;y+=60)x.fillRect(RX+LW*l-2,y,4,30);\nfor(const e of en)body(e.x,e.y,e.w,e.h,e.col,0);\nif(car)body(car.x,car.y,car.w,car.h,'#ff1e1e',1);\nif(state==='play'){x.textAlign='left';x.fillStyle='#ffffff';x.font='700 20px system-ui,sans-serif';x.fillText('Score '+Math.floor(sc),12,28)}\nelse{x.fillStyle='#050505cc';x.fillRect(0,0,W,H);\nif(state==='over'){txt('Crash!',230,40,'#f43f5e');txt('Score '+Math.floor(sc),275,26)}else txt('Neon Traffic',230,36,'#ff5555');\ntxt(state==='over'?'Tap or press Space to race again':'Tap or press Space to start',320,16,'#c9b8b8');txt('Steer: tap left or right side, or use \u2190 \u2192',348,14,'#c9b8b8')}}\n(function loop(){step();draw();requestAnimationFrame(loop)})();\n<\/script><\/body><\/html>\n", "memory": "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Memory Match<\/title>\n<style>body{margin:0;background:#050505;color:#ffffff;font:16px system-ui,sans-serif;display:grid;justify-items:center;align-content:center;min-height:100vh;padding:12px;box-sizing:border-box;gap:12px}\n#g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(92vw,380px)}\n.c{aspect-ratio:1;border-radius:12px;border:1px solid #4a1010;background:#120808;font-size:2rem;cursor:pointer;color:inherit;padding:0}\n.c.up{background:#4a0a0a;border-color:#ff1e1e}.c.ok{background:#a01515;border-color:#ff5555}\n.b{border:0;border-radius:10 addEventListener('message',e=>{const f=document.querySelector('iframe'),d=e.data;if(!f||e.source!==f.contentWindow||!d||d.gz!=='score'||!GN[d.game]||typeof d.score!=='number')return;saveScore(d.game,Math.min(Math.max(0,Math.floor(d.score)),99999));const el=$('#best'),uu=me();if(el&&uu)el.textContent=bestOf(uu,d.game)});
render();
</script>
